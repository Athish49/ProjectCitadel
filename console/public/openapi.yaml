openapi: "3.1.0"

info:
  title: SecureClaim AI — Showcase API
  version: "0.1.0"
  description: |
    Read-only public API surface for the SecureClaim AI Resilience Console.
    Exposes the attack-defense matrix, defense-pattern catalog, live architecture
    metadata, session replays, and the playground submission endpoint.

    All endpoints are public (no authentication required) except where noted.
    Playground submission (`POST /showcase/playground`) is rate-limited to
    10 requests per IP per minute.

    ## Transport types

    | Type | Prefix | Notes |
    |------|--------|-------|
    | REST | `/showcase/` | Standard JSON; ISR-cached where noted |
    | SSE  | `/sse/`       | `text/event-stream`; no caching |
    | WS   | `/ws/`        | See [WebSocket channels](#section/WebSocket-channels) below |

    ## WebSocket channels

    `ws://{host}/ws/playground`

    Bidirectional stream for the Attack Playground.  The client sends a
    `PlaygroundSubmission` JSON frame and the server pushes back
    `PlaygroundEvent` frames (one per defense layer evaluated) until a
    `verdict` event closes the stream.

    **Client → server frame:**
    ```json
    { "type": "submit", "payload": "<attack text>", "templateId": "string|null" }
    ```

    **Server → client frames:**
    ```json
    { "type": "layer_result", "layer": "P1", "outcome": "blocked|partial|pass",
      "detail": "string", "ts": "ISO-8601" }
    { "type": "verdict",      "outcome": "blocked|partial|successful",
      "traceId": "uuid",     "ts": "ISO-8601" }
    { "type": "error",        "code": "rate_limited|internal",
      "message": "string",   "ts": "ISO-8601" }
    ```

    At most 10 `layer_result` frames are emitted per submission.

servers:
  - url: http://localhost:8000
    description: Local dev (FastAPI)
  - url: https://api.secureclaim.example
    description: Production

tags:
  - name: matrix
    description: Attack-defense matrix data
  - name: patterns
    description: Defense pattern catalog (P1–P12)
  - name: architecture
    description: Live system topology and health
  - name: playground
    description: Interactive attack submission
  - name: sessions
    description: Session replays and traces
  - name: sse
    description: Server-Sent Events (live streams)

paths:

  # ─── Matrix ──────────────────────────────────────────────────────────────────

  /showcase/matrix:
    get:
      operationId: getMatrix
      tags: [matrix]
      summary: Full attack-defense matrix
      description: |
        Returns all 79 attack categories with aggregate test counts, the
        defense patterns that address each, and a current status indicator.
        Response is ISR-cached; cache is revalidated on every CI webhook.
      parameters:
        - $ref: "#/components/parameters/MatrixClassFilter"
        - $ref: "#/components/parameters/PatternFilter"
      responses:
        "200":
          description: Matrix data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatrixResponse"

  /showcase/matrix/{attackId}:
    get:
      operationId: getMatrixEntry
      tags: [matrix]
      summary: Single attack detail
      description: |
        Returns the full record for one attack category: description, defending
        patterns with code refs, and the most recent 20 test attempts.
      parameters:
        - $ref: "#/components/parameters/AttackIdPath"
      responses:
        "200":
          description: Attack detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttackDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Patterns ────────────────────────────────────────────────────────────────

  /showcase/patterns:
    get:
      operationId: getPatterns
      tags: [patterns]
      summary: Defense pattern catalog
      description: |
        Returns all 12 defense patterns (P1–P12) with full descriptions,
        the attack IDs each addresses, and implementation status.
        Response is ISR-cached; revalidates hourly.
      responses:
        "200":
          description: Pattern list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternsResponse"

  /showcase/patterns/{patternId}:
    get:
      operationId: getPattern
      tags: [patterns]
      summary: Single defense pattern
      parameters:
        - $ref: "#/components/parameters/PatternIdPath"
      responses:
        "200":
          description: Pattern detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pattern"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Architecture ─────────────────────────────────────────────────────────────

  /showcase/architecture:
    get:
      operationId: getArchitecture
      tags: [architecture]
      summary: Live system topology and agent health
      description: |
        Returns the React Flow graph data (nodes + edges) for the interactive
        architecture diagram, plus a per-agent liveness snapshot.
        Revalidates every 30 seconds.
      responses:
        "200":
          description: Architecture metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchitectureResponse"

  /showcase/health:
    get:
      operationId: getHealth
      tags: [architecture]
      summary: System-wide health counters
      description: |
        Current status dot data for the console header: attack counts, block
        rate, adversarial agent state. Same payload the `/sse/health` channel
        pushes every 5 seconds.
      responses:
        "200":
          description: Health counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSnapshot"

  # ─── Playground ──────────────────────────────────────────────────────────────

  /showcase/playground:
    post:
      operationId: submitPlayground
      tags: [playground]
      summary: Submit an attack payload
      description: |
        Queues a payload for evaluation against the live system. Returns a
        `traceId` immediately; subscribe to `/sse/playground/{traceId}` for
        streaming layer-by-layer results, or poll
        `/showcase/sessions/{traceId}` once complete.

        Rate-limited: 10 requests per IP per minute. Exceeding the limit
        returns HTTP 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaygroundSubmission"
      responses:
        "202":
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaygroundAccepted"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ─── Sessions ────────────────────────────────────────────────────────────────

  /showcase/sessions/{traceId}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Session replay payload
      description: |
        Returns the complete trace for a session: the original submission,
        every defense layer result, the final verdict, and the timing
        breakdown. Used by the replay viewer and shareable URLs.
        Responses are cached per `traceId` once the session is complete.
      parameters:
        - $ref: "#/components/parameters/TraceIdPath"
      responses:
        "200":
          description: Session replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReplay"
        "202":
          description: Session still processing — retry after `Retry-After` seconds
          headers:
            Retry-After:
              schema:
                type: integer
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── SSE ─────────────────────────────────────────────────────────────────────

  /sse/audit:
    get:
      operationId: streamAudit
      tags: [sse]
      summary: Live audit event stream
      description: |
        Pushes new `audit_log` rows as they are written, up to 200 events/s.
        Clients should reconnect on disconnect using the `Last-Event-ID`
        header to resume from the last received event.

        **Event type:** `audit`
        **Payload schema:** `AuditEvent`
      parameters:
        - name: agent
          in: query
          description: Filter by agent id (e.g. `claims_processor`)
          schema:
            type: string
        - name: severity
          in: query
          schema:
            $ref: "#/components/schemas/Severity"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/AuditEvent"
              x-sse-events:
                - name: audit
                  schema:
                    $ref: "#/components/schemas/AuditEvent"

  /sse/adversarial:
    get:
      operationId: streamAdversarial
      tags: [sse]
      summary: Adversarial agent attempt stream
      description: |
        Pushes one event per attempt by the autonomous adversarial agent,
        up to 1 event/s. Includes the attack category, target endpoint,
        outcome, and the defense layer that blocked (or did not block) it.

        **Event type:** `attempt`
        **Payload schema:** `AdversarialEvent`
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/AdversarialEvent"
              x-sse-events:
                - name: attempt
                  schema:
                    $ref: "#/components/schemas/AdversarialEvent"

  /sse/health:
    get:
      operationId: streamHealth
      tags: [sse]
      summary: Health counter stream
      description: |
        Pushes a `HealthSnapshot` every 5 seconds. Powers the header status
        bar. Clients should fall back to polling `/showcase/health` on
        EventSource connection failure.

        **Event type:** `health`
        **Payload schema:** `HealthSnapshot`
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/HealthSnapshot"
              x-sse-events:
                - name: health
                  schema:
                    $ref: "#/components/schemas/HealthSnapshot"

  /sse/playground/{traceId}:
    get:
      operationId: streamPlayground
      tags: [sse, playground]
      summary: Defense-trace event stream for a playground submission
      description: |
        Pushes up to 10 `layer_result` events followed by a single `verdict`
        event. The stream closes after the `verdict`. Clients should treat
        a stream close without a `verdict` as a server error and retry.

        **Event types:** `layer_result`, `verdict`
        **Payload schemas:** `LayerResult`, `PlaygroundVerdict`
      parameters:
        - $ref: "#/components/parameters/TraceIdPath"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LayerResult"
                  - $ref: "#/components/schemas/PlaygroundVerdict"
              x-sse-events:
                - name: layer_result
                  schema:
                    $ref: "#/components/schemas/LayerResult"
                - name: verdict
                  schema:
                    $ref: "#/components/schemas/PlaygroundVerdict"
        "404":
          $ref: "#/components/responses/NotFound"

components:

  # ─── Parameters ──────────────────────────────────────────────────────────────

  parameters:
    AttackIdPath:
      name: attackId
      in: path
      required: true
      description: Attack category ID (1–79)
      schema:
        type: integer
        minimum: 1
        maximum: 79

    PatternIdPath:
      name: patternId
      in: path
      required: true
      description: Pattern identifier, e.g. `P1` through `P12`
      schema:
        $ref: "#/components/schemas/PatternId"

    TraceIdPath:
      name: traceId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    MatrixClassFilter:
      name: class
      in: query
      description: Filter rows to a specific test-result class
      schema:
        $ref: "#/components/schemas/MatrixClass"

    PatternFilter:
      name: pattern
      in: query
      description: Filter to attacks addressed by a specific pattern ID
      schema:
        $ref: "#/components/schemas/PatternId"

  # ─── Responses ───────────────────────────────────────────────────────────────

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Request body failed schema validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the rate limit resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  # ─── Schemas ─────────────────────────────────────────────────────────────────

  schemas:

    # Enumerations

    TrustLabel:
      type: string
      enum: [public, personal, confidential, secret, untrusted]
      description: Information flow control label (Doc 02 §2.6)

    Severity:
      type: string
      enum: [info, warn, critical]
      description: Security-event severity (maps to security_events.severity)

    MatrixClass:
      type: string
      enum: [BLOCKED, PARTIAL, SUCCESSFUL, UNTESTED]
      description: |
        Aggregate test outcome for an attack category.
        `BLOCKED` — all recorded attempts blocked; `PARTIAL` — blocked in
        most but not all scenarios; `SUCCESSFUL` — at least one unblocked
        attempt recorded; `UNTESTED` — no test data yet.

    PatternId:
      type: string
      pattern: "^P(1[0-2]|[1-9])$"
      description: Defense pattern identifier P1–P12
      example: P8

    AttackOutcome:
      type: string
      enum: [blocked, partial, successful]

    AgentId:
      type: string
      enum:
        - orchestrator
        - intake_parser
        - claims_processor
        - settlement_actor
        - adversarial_agent
      description: Named agents in the system

    # Matrix

    MatrixRow:
      type: object
      required: [attackId, name, class, patterns, blockedCount, partialCount, successfulCount]
      properties:
        attackId:
          type: integer
          minimum: 1
          maximum: 79
        name:
          type: string
          description: Short attack category name (from the 79-category taxonomy)
          example: "Prompt Injection via PDF"
        class:
          $ref: "#/components/schemas/MatrixClass"
        patterns:
          type: array
          items:
            $ref: "#/components/schemas/PatternId"
          description: Defense patterns that address this attack
        blockedCount:
          type: integer
          minimum: 0
        partialCount:
          type: integer
          minimum: 0
        successfulCount:
          type: integer
          minimum: 0
        lastTestedAt:
          type: string
          format: date-time
          nullable: true

    MatrixResponse:
      type: object
      required: [rows, generatedAt]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/MatrixRow"
        generatedAt:
          type: string
          format: date-time

    AttemptSummary:
      type: object
      required: [traceId, outcome, ts]
      properties:
        traceId:
          type: string
          format: uuid
        outcome:
          $ref: "#/components/schemas/AttackOutcome"
        blockedByPattern:
          $ref: "#/components/schemas/PatternId"
          nullable: true
          description: First pattern that blocked the attempt, if blocked
        ts:
          type: string
          format: date-time

    CodeRef:
      type: object
      required: [label, path]
      properties:
        label:
          type: string
          example: "Envelope verifier"
        path:
          type: string
          description: Repo-relative file path
          example: "agents/orchestrator/envelope.py"
        lineStart:
          type: integer
          nullable: true
        lineEnd:
          type: integer
          nullable: true

    AttackDetail:
      type: object
      required: [attackId, name, description, class, patterns, recentAttempts]
      properties:
        attackId:
          type: integer
          minimum: 1
          maximum: 79
        name:
          type: string
        description:
          type: string
        class:
          $ref: "#/components/schemas/MatrixClass"
        patterns:
          type: array
          items:
            $ref: "#/components/schemas/PatternId"
        codeRefs:
          type: array
          items:
            $ref: "#/components/schemas/CodeRef"
        recentAttempts:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AttemptSummary"

    # Patterns

    Pattern:
      type: object
      required: [id, name, summary, attackIds, implemented]
      properties:
        id:
          $ref: "#/components/schemas/PatternId"
        name:
          type: string
          example: "Signed Inter-Agent Envelopes"
        summary:
          type: string
          description: One-sentence description of what the pattern does
        description:
          type: string
          description: Full markdown description
        attackIds:
          type: array
          items:
            type: integer
          description: Attack category IDs this pattern addresses
          example: [40, 44, 47]
        implemented:
          type: boolean
          description: Whether the pattern has been implemented in this version
        codeRefs:
          type: array
          items:
            $ref: "#/components/schemas/CodeRef"
        testCount:
          type: integer
          minimum: 0
          description: Number of test cases that exercise this pattern

    PatternsResponse:
      type: object
      required: [patterns, generatedAt]
      properties:
        patterns:
          type: array
          items:
            $ref: "#/components/schemas/Pattern"
        generatedAt:
          type: string
          format: date-time

    # Architecture

    ArchNode:
      type: object
      required: [id, label, type]
      properties:
        id:
          type: string
          example: "claims_processor"
        label:
          type: string
          example: "Claims Processor"
        type:
          type: string
          enum: [agent, parser, orchestrator, datastore, filter, external]
        status:
          type: string
          enum: [healthy, degraded, offline, unknown]
          default: unknown
        patterns:
          type: array
          items:
            $ref: "#/components/schemas/PatternId"
          description: Patterns implemented by this node

    ArchEdge:
      type: object
      required: [id, source, target]
      properties:
        id:
          type: string
        source:
          type: string
          description: Source node id
        target:
          type: string
          description: Target node id
        label:
          type: string
          nullable: true
          description: Edge transport label, e.g. "signed envelope (P8)"
        transport:
          type: string
          enum: [envelope, tool_call, sse, rest, rls_query, direct]
          nullable: true

    ArchitectureResponse:
      type: object
      required: [nodes, edges, snapshotAt]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ArchNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/ArchEdge"
        snapshotAt:
          type: string
          format: date-time

    # Health

    HealthSnapshot:
      type: object
      required: [attacksToday, blockedToday, successfulToday, adversarialState, ts]
      properties:
        attacksToday:
          type: integer
          minimum: 0
        blockedToday:
          type: integer
          minimum: 0
        successfulToday:
          type: integer
          minimum: 0
        adversarialState:
          type: string
          enum: [running, paused, throttled, offline]
        chainStatus:
          type: string
          enum: [verified, broken, unknown]
          description: Audit-log hash-chain verification status (P9)
        ts:
          type: string
          format: date-time

    # Playground

    PlaygroundSubmission:
      type: object
      required: [payload]
      properties:
        payload:
          type: string
          minLength: 1
          maxLength: 8000
          description: Attack text to submit
        templateId:
          type: string
          nullable: true
          description: Pre-loaded attack template identifier, e.g. `indirect-pdf-3`

    PlaygroundAccepted:
      type: object
      required: [traceId, sseUrl]
      properties:
        traceId:
          type: string
          format: uuid
        sseUrl:
          type: string
          description: Full URL for the SSE stream, e.g. `/sse/playground/{traceId}`

    LayerResult:
      type: object
      required: [type, layer, outcome, ts]
      properties:
        type:
          type: string
          enum: [layer_result]
        layer:
          $ref: "#/components/schemas/PatternId"
        outcome:
          $ref: "#/components/schemas/AttackOutcome"
        detail:
          type: string
          description: Human-readable description of what the layer detected or passed
        ts:
          type: string
          format: date-time

    PlaygroundVerdict:
      type: object
      required: [type, outcome, traceId, ts]
      properties:
        type:
          type: string
          enum: [verdict]
        outcome:
          $ref: "#/components/schemas/AttackOutcome"
        traceId:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time

    # Sessions

    SessionReplay:
      type: object
      required: [traceId, submission, layers, verdict, durationMs, createdAt]
      properties:
        traceId:
          type: string
          format: uuid
        submission:
          $ref: "#/components/schemas/PlaygroundSubmission"
        layers:
          type: array
          items:
            $ref: "#/components/schemas/LayerResult"
        verdict:
          $ref: "#/components/schemas/PlaygroundVerdict"
        durationMs:
          type: integer
          minimum: 0
          description: Total evaluation time in milliseconds
        createdAt:
          type: string
          format: date-time

    # SSE payloads

    AuditEvent:
      type: object
      required: [eventId, traceId, eventType, severity, ts]
      properties:
        eventId:
          type: string
          format: uuid
        traceId:
          type: string
          format: uuid
        agentId:
          $ref: "#/components/schemas/AgentId"
          nullable: true
        eventType:
          type: string
          description: |
            One of: injection_pattern_hit, semantic_score_high,
            schema_violation, capability_denied, rls_denied,
            pii_egress_blocked, url_egress_blocked,
            token_budget_exceeded, chain_broken, chain_verified,
            identity_lockout, or a freeform application event.
          example: "injection_pattern_hit"
        attackId:
          type: integer
          minimum: 1
          maximum: 79
          nullable: true
          description: Taxonomy ID if this event maps to an attack category
        severity:
          $ref: "#/components/schemas/Severity"
        details:
          type: object
          additionalProperties: true
          nullable: true
        ts:
          type: string
          format: date-time

    AdversarialEvent:
      type: object
      required: [traceId, attackId, targetEndpoint, outcome, ts]
      properties:
        traceId:
          type: string
          format: uuid
        attackId:
          type: integer
          minimum: 1
          maximum: 79
        targetEndpoint:
          type: string
          description: The system endpoint or agent the adversarial agent targeted
          example: "/intake"
        outcome:
          $ref: "#/components/schemas/AttackOutcome"
        blockedByPattern:
          $ref: "#/components/schemas/PatternId"
          nullable: true
        ts:
          type: string
          format: date-time

    # Shared

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: "not_found"
        message:
          type: string
          example: "Attack ID 99 does not exist"
