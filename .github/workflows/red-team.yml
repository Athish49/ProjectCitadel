name: Red-Team Suite

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Job 1: Unit tests (no external services needed) ───────────────────────────
jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit red-team suite
        run: |
          uv run pytest tests/unit/ -m unit \
            --json-report --json-report-file=unit-results.json \
            -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: backend/unit-results.json

# ── Job 2: Integration tests (Postgres + ChromaDB) ───────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secureclaim
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      chromadb:
        image: chromadb/chroma:0.5.20
        env:
          IS_PERSISTENT: "FALSE"
          ANONYMIZED_TELEMETRY: "FALSE"
        ports:
          - 8000:8000
        options: >-
          --health-cmd "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v2/heartbeat\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run migrations
        run: uv run python -m db.migrate
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secureclaim
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

      - name: Seed ChromaDB (policy docs + fraud rules)
        run: uv run python -m db.seed
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secureclaim
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          CHROMADB_HOST: localhost
          CHROMADB_PORT: 8000
        continue-on-error: true  # seed is best-effort; tests that need it are skipped if absent

      - name: Run integration red-team suite
        run: |
          uv run pytest tests/integration/ -m integration \
            --json-report --json-report-file=integration-results.json \
            -q
        env:
          TEST_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/secureclaim
          TEST_APP_DSN: postgresql://secureclaim_app:secureclaim_app@localhost:5432/secureclaim
          TEST_ORCHESTRATOR_DSN: postgresql://role_orchestrator:role_orchestrator@localhost:5432/secureclaim

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: backend/integration-results.json

# ── Job 3: Publish results to Console matrix (main only) ─────────────────────
  publish-results:
    name: Publish CI Results
    needs: [unit, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download unit results
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: artifacts/

      - name: Download integration results
        uses: actions/download-artifact@v4
        with:
          name: integration-test-results
          path: artifacts/
        continue-on-error: true  # integration artifact may be absent on failure

      - name: Generate ci-test-results.json
        run: python3 backend/scripts/generate_ci_report.py
        env:
          UNIT_RESULTS: artifacts/unit-results.json
          INTEGRATION_RESULTS: artifacts/integration-results.json
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add console/public/ci-test-results.json
          git diff --staged --quiet || git commit -m "ci: update test results [skip ci]"
          git push
