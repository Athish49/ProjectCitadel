name: secureclaim

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: secureclaim-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-secureclaim}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-secureclaim}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  tempo:
    image: grafana/tempo:2.6.1
    container_name: secureclaim-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"
    volumes:
      - ./infra/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: secureclaim-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  grafana:
    image: grafana/grafana:11.3.0
    container_name: secureclaim-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Adversarial agent + its dedicated API target (Sprint 4.3.1)
  #
  # Network isolation:
  #   adversarial-api  → default network (DB) + adversarial_net (attack traffic)
  #   adversarial-agent → adversarial_net ONLY (cannot reach postgres directly)
  # ---------------------------------------------------------------------------
  adversarial-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secureclaim-adversarial-api
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: secureclaim-adversarial-api
    ports:
      - "${ADVERSARIAL_API_PORT:-8081}:8080"
    networks:
      - default
      - adversarial_net
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    profiles:
      - adversarial

  adversarial-agent:
    build:
      context: adversarial_agent
      dockerfile: Dockerfile
    container_name: secureclaim-adversarial-agent
    environment:
      TARGET_API_URL: http://adversarial-api:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: ${ADVERSARIAL_LOG_LEVEL:-INFO}
      LOOP_INTERVAL_SECONDS: ${ADVERSARIAL_LOOP_INTERVAL:-300}
      MONTHLY_SPEND_CAP_USD: ${MONTHLY_SPEND_CAP_USD:-50.0}
      SPEND_LEDGER_PATH: /var/spend/ledger.json
    volumes:
      - adversarial_spend:/var/spend
    networks:
      - adversarial_net
    depends_on:
      adversarial-api:
        condition: service_healthy
    profiles:
      - adversarial

volumes:
  pgdata:
  tempodata:
  grafanadata:
  adversarial_spend:

networks:
  adversarial_net:
    driver: bridge
